[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disease-dynamics"
version = "0.1.0"
description = "Mechanistic and statistical models linking wet-lab measurements to public multi-omics and epidemiology data"
requires-python = ">=3.11"
dependencies = ["numpy<2.4", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The known-answer checks live in notebooks/scope_map_walkthrough.ipynb (generated by
# tools/make_notebook.py). pytest, if installed, runs only the docstring examples.
pythonpath = ["src"]
testpaths = ["src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
